# Pipeline de Integración Continua — Sistema de inventario del taller
# Se ejecuta en cada push (a cualquier rama) y en cada pull request.
# Si una prueba falla, el job queda en rojo y el PR no debería fusionarse.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Si se hace un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (exactas, desde package-lock.json)
        run: npm ci

      # La prueba de contrato y la de aceptación de la HU-09 ejecutan el modelo real.
      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prediccion/requirements.txt

      - name: Instalar las librerías del modelo de predicción
        run: pip install -r prediccion/requirements.txt

      - name: Build (verificación de sintaxis y construcción de la app)
        run: npm run build

      - name: Ejecutar pruebas con cobertura
        run: npm run test:cobertura
        env:
          # En el pipeline el modelo de Python es obligatorio: si falta, las pruebas fallan en vez de omitirse.
          EXIGIR_PYTHON: '1'
          PYTHON_BIN: python

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/
          retention-days: 7

  modelo:
    name: Modelo de predicción (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prediccion/requirements-dev.txt

      - name: Instalar las librerías del modelo
        run: pip install -r prediccion/requirements-dev.txt

      - name: Ejecutar las pruebas del modelo (pytest)
        working-directory: prediccion
        run: python -m pytest

  auditoria:
    name: Análisis de vulnerabilidades de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: npm audit (falla si hay vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: pip-audit (vulnerabilidades conocidas en las librerías de Python)
        run: |
          pip install pip-audit
          pip-audit -r prediccion/requirements.txt
