# Dependabot revisa cada semana si hay versiones nuevas (sobre todo parches
# de seguridad) y abre un pull request por cada actualización.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # jsdom 27 en adelante usa módulos que Jest no puede cargar en Node 22 (ver ADR-13).
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore

  - package-ecosystem: pip
    directory: /prediccion
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
